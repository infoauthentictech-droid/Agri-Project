# Detector label mapping — single source of truth for label status.
# status: unconfirmed | confirmed
# CONFIRMED on 2026-09-17 by the researcher: the detector is a binary
# groundnut-vs-weed model.
#   class 0 = groundnut  (Arachis hypogaea crop/plant)
#   class 1 = weed       (any other plant/crop/weed — non-groundnut)
# Update this file when a ground-truth study revises the mapping, then update
# datasets/processed/groundnut_weed_detection/data.yaml and re-verify the
# backend reports labels_confirmed: true.

version: 2
status: confirmed
confirmed_on: "2026-09-17"
confirmed_by: "researcher (dataset semantics review)"
methodology: "Researcher-defined binary crop/weed semantics: Arachis hypogaea +
Peanut-dataset-main -> groundnut; agri_data + Peanut weed masks -> weed."
mapping:
  0:
    name: groundnut
    semantics: "Groundnut (Arachis hypogaea L.) crop/plant"
  1:
    name: weed
    semantics: "Any other plant, crop or weed (non-groundnut)"
guide: docs/DETECTOR_LABELS.md