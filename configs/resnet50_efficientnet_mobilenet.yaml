# ResNet50 + EfficientNet + MobileNet hybrid model configuration
# Three-way ensemble leveraging strengths of all three architectures

experiment_name: resnet50_efficientnet_mobilenet
seed: 42

dataset:
  root: datasets/processed/classification_groundnut_weed
  image_size: 224
  augmentation: mosaic_mixup

model:
  name: resnet50_efficientnet_mobilenet
  num_classes: 2
  pretrained: true

training:
  epochs: 30
  batch_size: 8
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_step_epochs: 10
  lr_gamma: 0.5
  early_stop_patience: 8
  num_workers: 2

evaluation:
  batch_size: 16

output_dir: experiments/classification/resnet50_efficientnet_mobilenet
